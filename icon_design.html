<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:512px;height:512px;overflow:hidden;background:#ffffff;}
  svg{display:block;}
</style>
</head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="44%" r="56%">
      <stop offset="0%" stop-color="#FCE9AE"/>
      <stop offset="65%" stop-color="#F6D67E"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </radialGradient>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF6E7"/>
      <stop offset="100%" stop-color="#EAD5A0"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#8CDB8C"/>
      <stop offset="35%" stop-color="#3FAE4E"/>
      <stop offset="100%" stop-color="#1F7A34"/>
    </linearGradient>
    <linearGradient id="moonShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="crescentMask">
      <rect x="0" y="0" width="512" height="512" fill="black"/>
      <circle cx="256" cy="256" r="188" fill="white"/>
      <circle cx="368" cy="256" r="163" fill="black"/>
    </mask>
    <mask id="shineMask">
      <rect x="0" y="0" width="512" height="512" fill="black"/>
      <circle cx="256" cy="256" r="188" fill="white"/>
      <circle cx="368" cy="256" r="163" fill="black"/>
      <rect x="256" y="256" width="256" height="256" fill="black"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <ellipse cx="266" cy="440" rx="150" ry="20" fill="#C9D3DE" opacity="0.55"/>
  <circle cx="256" cy="238" r="196" fill="url(#glow)"/>

  <!-- Wooden rehal (book stand), X shape -->
  <g>
    <path d="M 256 356 L 118 470 L 150 480 L 256 392 L 362 480 L 394 470 Z" fill="#5A3A22"/>
    <path d="M 256 356 L 118 246 L 150 236 L 256 322 L 362 236 L 394 246 Z" fill="#6E4A2A"/>
    <circle cx="256" cy="356" r="10" fill="#3E2814"/>
  </g>

  <!-- Open Qur'an resting on the stand -->
  <g transform="translate(256,326)">
    <path d="M -4 -68 C -70 -87 -110 -72 -110 -45 L -110 32 C -110 7 -70 -6 -4 9 Z"
          fill="url(#bookGrad)" stroke="#BC9A66" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 4 -68 C 70 -87 110 -72 110 -45 L 110 32 C 110 7 70 -6 4 9 Z"
          fill="url(#bookGrad)" stroke="#BC9A66" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -4 -68 L -4 9 L 4 9 L 4 -68 Z" fill="#CBAA72" opacity="0.7"/>
    <g stroke="#BC9A66" stroke-width="2.6" stroke-linecap="round" opacity="0.6">
      <path d="M -92 -52 C -65 -62 -35 -57 -14 -48" fill="none"/>
      <path d="M -94 -27 C -67 -37 -35 -33 -10 -23" fill="none"/>
      <path d="M -96 -2 C -69 -10 -35 -8 -6 1" fill="none"/>

      <path d="M 92 -52 C 65 -62 35 -57 14 -48" fill="none"/>
      <path d="M 94 -27 C 67 -37 35 -33 10 -23" fill="none"/>
      <path d="M 96 -2 C 69 -10 35 -8 6 1" fill="none"/>
    </g>
  </g>

  <!-- Crescent moon: glossy, matches original mark, opening right -->
  <rect x="0" y="0" width="512" height="512" fill="url(#moonGrad)" mask="url(#crescentMask)"/>
  <ellipse cx="150" cy="150" rx="130" ry="90" fill="url(#moonShine)" mask="url(#shineMask)" transform="rotate(-35 150 150)"/>
</svg>
</body></html>
