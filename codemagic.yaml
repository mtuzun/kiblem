workflows:
  ios-workflow:
    name: Kıblem iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: kiblem_app_store_connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.metint.ezanvakti
      vars:
        APP_STORE_APPLE_ID: 6828909864
      flutter: 3.41.4 # Yerel sürümle aynı; "stable" değişirse derleme bozulmasın diye sabitlendi
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Analyze Dart code
        script: |
          flutter analyze --no-fatal-infos
      - name: Install pods
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false # true harici test incelemesi ister (geri bildirim e-postası vb.); iç test için gerekmez
        submit_to_app_store: false

  ios-adhoc-workflow:
    # Kayıtlı test cihazlarına doğrudan kurulum için (TestFlight olmadan). Yayınlama yapmaz.
    name: Kıblem iOS Ad Hoc
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: kiblem_app_store_connect
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.metint.ezanvakti
      flutter: 3.41.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Süreli indirme bağlantısı e-postayla gelir; TestFlight'a ya da mağazaya gitmez.
      email:
        recipients:
          - metintzn2026@gmail.com
        notify:
          success: true
          failure: false
